services:
  headless-orca:
    build:
      context: .
      args:
        ORCA_VERSION: latest   # pin to a real tag, e.g. v1.4.199, once you've tested it
    image: headless-orca
    container_name: headless-orca
    restart: unless-stopped
    # Run the process as the numeric UID/GID that owns the host's synced projects
    # folder (`dockerApps` on the Docker host — verify with `id dockerApps` and
    # keep this line in sync if it ever changes). Bind mounts translate numeric
    # IDs literally, so anything the container writes into /mnt/projects lands
    # owned by that user on the host, and the host-side Syncthing (same user)
    # keeps full access. This overrides the image's `USER orca` (1000:1000) at
    # container creation — no rebuild needed. Known cosmetic: `whoami`/`id`
    # inside the container can't resolve a name for uid 1001 (the image's passwd
    # entry still says orca=1000) — harmless, $HOME comes from ORCA_HOME, not
    # passwd. After changing this value, chown the orca-data volume once (see
    # README → Persistence → "Sharing a host folder").
    user: "1001:1001"
    environment:
      # Address remote Orca clients (desktop/mobile) should dial —
      # your docker host's Tailscale IP, LAN IP, or tunnel hostname.
      # Placeholder below (RFC 5737 TEST-NET-1) — replace with your own
      # host's real address before running; don't commit your real one.
      ORCA_PAIRING_ADDRESS: "192.0.2.10"
      ORCA_PORT: "6768"
      # Pin HOME for the `user:` UID override below: a UID with no passwd
      # entry gets no HOME from Docker, and Electron crash-loops without it.
      # Redundant with the image ENV on new builds; kept so older published
      # images work under the override without a rebuild.
      HOME: /home/orca
    ports:
      - "6768:6768"
    volumes:
      - orca-data:/home/orca
      # Host projects folder (the Syncthing-synced tree). The source path is
      # host-specific, so it's deliberately not committed — set it, then
      # uncomment:
      # - /path/on/host/projects:/mnt/projects
      # Uncomment to let agent CLIs use your existing SSH keys for git:
      # - ~/.ssh:/home/orca/.ssh:ro
    # Only uncomment if logs show a Chromium sandbox error, and try without
    # it first — AppRun auto-detects sandbox availability and falls back to
    # --no-sandbox on its own (see entrypoint.sh). SYS_ADMIN is a broad
    # capability that meaningfully weakens container isolation; it's a
    # last resort, not a default.
    # cap_add:
    #   - SYS_ADMIN

volumes:
  orca-data:
    name: orca-data
